# Fly.io deployment configuration (optional alternative)
# Usage: fly launch --config fly.toml
# Docs: https://fly.io/docs/reference/configuration/

app = "trustrag-backend"
primary_region = "sjc"      # San Jose, US West

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory     = "512mb"
  cpu_kind   = "shared"
  cpus       = 1
