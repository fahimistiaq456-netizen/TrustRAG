# Render.com deployment configuration
# Docs: https://render.com/docs/yaml-spec

services:
  # ── TrustRAG FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: trustrag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health

    envVars:
      - key: HALLUFIX_INDEX_DIR
        value: data/index

      - key: HALLUFIX_ABSTENTION_THRESHOLD
        value: "0.25"

      - key: HALLUFIX_OLLAMA_HOST
        value: ""

      - key: HALLUFIX_OLLAMA_MODEL
        value: llama3.2:3b

      - key: HALLUFIX_RERANKER_ENABLED
        value: "false"

      - key: HALLUFIX_NLI_ENABLED
        value: "false"

      - key: HALLUFIX_GRAPH_ENABLED
        value: "false"

      - key: HALLUFIX_AUTH_ENABLED
        value: "false"

      - key: HALLUFIX_JWT_SECRET
        generateValue: true

      - key: HALLUFIX_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: HALLUFIX_CORS_ORIGINS
        value: "*"

  # ── TrustRAG Next.js Frontend ─────────────────────────────────────────────
  - type: web
    name: trustrag-frontend
    runtime: node
    rootDir: webapp
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: trustrag-backend
          property: host
